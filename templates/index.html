<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acne Detector Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4F46E5", // Indigo 600
              secondary: "#10B981", // Emerald 500
              dark: "#111827", // Gray 900
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .gradient-text {
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body
    class="bg-dark text-white min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary selection:text-white"
  >
    <div class="max-w-3xl w-full">
      <!-- Header -->
      <div class="text-center mb-10">
        <h1 class="text-5xl font-bold tracking-tight mb-4">
          <span
            class="bg-gradient-to-r from-primary to-purple-500 gradient-text"
            >Jasmine Rise</span
          >
          Detector
        </h1>
        <p class="text-gray-400 text-lg max-w-xl mx-auto">
          Testing nganiiii, judge ka naman agad. Inamoka!! 💗💗
        </p>
      </div>

      <!-- Main Panel -->
      <div
        class="glass-panel rounded-2xl p-8 shadow-2xl transition-all duration-300 hover:shadow-primary/20"
      >
        <div class="grid md:grid-cols-2 gap-8 relative">
          <!-- Left Column: Input Options -->
          <div class="space-y-6 flex flex-col justify-center">
            <!-- File Upload -->
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2"
                >Upload Image</label
              >
              <div class="relative group">
                <input
                  type="file"
                  id="fileInput"
                  accept="image/*"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                  onchange="previewFile()"
                />
                <div
                  class="flex items-center justify-center w-full px-4 py-8 border-2 border-dashed border-gray-600 rounded-xl group-hover:border-primary transition-colors bg-gray-800/50"
                >
                  <div class="text-center">
                    <svg
                      class="mx-auto h-12 w-12 text-gray-400 group-hover:text-primary transition-colors"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                      />
                    </svg>
                    <p class="mt-2 text-sm text-gray-400">
                      Click to browse or drag and drop
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div class="flex items-center justify-center space-x-4">
              <hr class="w-full border-gray-700" />
              <span
                class="text-xs text-gray-500 font-semibold uppercase tracking-wider"
                >or</span
              >
              <hr class="w-full border-gray-700" />
            </div>

            <!-- Camera Control -->
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2"
                >Use Camera</label
              >
              <button
                id="cameraBtn"
                onclick="toggleCamera()"
                class="w-full flex items-center justify-center px-4 py-3 border border-transparent text-sm font-medium rounded-xl text-white bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-dark focus:ring-gray-500 transition-colors"
              >
                <svg
                  class="w-5 h-5 mr-2"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                </svg>
                <span id="cameraBtnText">Open Camera</span>
              </button>

              <!-- Camera View (Hidden by default) -->
              <div
                id="cameraContainer"
                class="hidden mt-4 relative rounded-xl overflow-hidden bg-black aspect-video border border-gray-700"
              >
                <video
                  id="video"
                  class="w-full h-full object-cover"
                  autoplay
                  playsinline
                ></video>
                <button
                  onclick="captureImage()"
                  class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-primary hover:bg-indigo-500 text-white rounded-full p-4 shadow-lg transition-transform active:scale-95 focus:outline-none"
                >
                  <svg
                    class="w-6 h-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Column: Preview & Results -->
          <div class="flex flex-col h-full space-y-4">
            <div
              class="flex-grow glass-panel rounded-xl flex items-center justify-center p-2 relative min-h-[250px] overflow-hidden group"
            >
              <!-- Placeholder -->
              <div id="previewPlaceholder" class="text-center text-gray-500">
                <span class="block text-4xl mb-2">📷</span>
                <p class="text-sm">Image Preview</p>
              </div>

              <!-- Actual Image -->
              <img
                id="imagePreview"
                class="hidden max-h-full max-w-full rounded-lg object-contain"
                alt="Preview"
              />

              <!-- Overlay Canvas (for potential bounding boxes later) -->
              <canvas
                id="overlay"
                class="absolute inset-0 w-full h-full pointer-events-none"
              ></canvas>
            </div>

            <!-- Action Button -->
            <button
              id="analyzeBtn"
              onclick="analyzeImage()"
              disabled
              class="w-full relative overflow-hidden group py-3 px-6 rounded-xl font-bold text-lg text-white bg-gradient-to-r from-gray-700 to-gray-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg"
            >
              <span class="relative z-10 flex items-center justify-center">
                <svg
                  id="loadingIcon"
                  class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
                <span id="analyzeBtnText">Analyze Image</span>
              </span>
              <div
                class="absolute inset-0 h-full w-full bg-gradient-to-r from-primary to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300 hidden"
                id="analyzeBtnBgHover"
              ></div>
            </button>

            <!-- Result Box -->
            <div
              id="resultContainer"
              class="hidden p-4 rounded-xl border transform transition-all duration-500 text-center"
            >
              <p
                class="text-xs uppercase tracking-wider font-semibold text-gray-400 mb-1"
              >
                Analysis Result
              </p>
              <h3 id="resultText" class="text-2xl font-bold"></h3>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-center text-gray-500 text-sm mt-8">
        Powered by OpenCV & Scikit-Learn. Built for academic thesis.
      </p>
    </div>

    <!-- Hidden canvas to grab video frames -->
    <canvas id="captureCanvas" class="hidden"></canvas>

    <script>
      // DOM Elements
      const fileInput = document.getElementById("fileInput");
      const imagePreview = document.getElementById("imagePreview");
      const previewPlaceholder = document.getElementById("previewPlaceholder");
      const analyzeBtn = document.getElementById("analyzeBtn");
      const analyzeBtnText = document.getElementById("analyzeBtnText");
      const analyzeBtnBgHover = document.getElementById("analyzeBtnBgHover");
      const resultContainer = document.getElementById("resultContainer");
      const resultText = document.getElementById("resultText");
      const loadingIcon = document.getElementById("loadingIcon");

      // Camera Elements
      const video = document.getElementById("video");
      const cameraContainer = document.getElementById("cameraContainer");
      const cameraBtnText = document.getElementById("cameraBtnText");
      const captureCanvas = document.getElementById("captureCanvas");

      let stream = null;
      let selectedFile = null;
      let base64Image = null;

      // Enable Analyze button visually
      function enableAnalyzeBtn() {
        analyzeBtn.disabled = false;
        analyzeBtn.classList.remove("from-gray-700", "to-gray-600");
        analyzeBtn.classList.add("from-primary", "to-purple-600");
        analyzeBtnBgHover.classList.remove("hidden");
      }

      // --- File Upload Logic ---
      function previewFile() {
        const file = fileInput.files[0];
        if (file) {
          selectedFile = file;
          base64Image = null; // Clear camera image

          const reader = new FileReader();
          reader.onload = function (e) {
            showPreview(e.target.result);
          };
          reader.readAsDataURL(file);

          // Close camera if open
          if (stream) stopCamera();
        }
      }

      // --- Camera Logic ---
      async function toggleCamera() {
        if (stream) {
          stopCamera();
        } else {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "user" }, // Try front camera first
              audio: false,
            });
            video.srcObject = stream;
            cameraContainer.classList.remove("hidden");
            cameraBtnText.textContent = "Close Camera";
          } catch (err) {
            console.error("Error accessing camera:", err);
            alert(
              "Could not access camera. Please allow permissions or upload a file instead.",
            );
          }
        }
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
          cameraContainer.classList.add("hidden");
          cameraBtnText.textContent = "Open Camera";
        }
      }

      function captureImage() {
        if (!stream) return;

        // Set canvas to video dimensions
        captureCanvas.width = video.videoWidth;
        captureCanvas.height = video.videoHeight;

        // Draw current video frame to canvas
        const ctx = captureCanvas.getContext("2d");
        ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

        // Get data URL
        const dataUrl = captureCanvas.toDataURL("image/jpeg", 0.9);
        base64Image = dataUrl;
        selectedFile = null; // Clear uploaded file

        showPreview(dataUrl);
        stopCamera();
      }

      // --- Common Preview ---
      function showPreview(src) {
        imagePreview.src = src;
        imagePreview.classList.remove("hidden");
        previewPlaceholder.classList.add("hidden");
        resultContainer.classList.add("hidden"); // Hide old results
        enableAnalyzeBtn();
      }

      // --- API Submission ---
      async function analyzeImage() {
        if (!selectedFile && !base64Image) return;

        // UI State loading
        analyzeBtn.disabled = true;
        analyzeBtnText.textContent = "Analyzing...";
        loadingIcon.classList.remove("hidden");
        resultContainer.classList.add("hidden");

        try {
          let formData = new FormData();

          if (selectedFile) {
            formData.append("file", selectedFile);
          } else if (base64Image) {
            formData.append("image_base64", base64Image);
          }

          const response = await fetch("/predict", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (response.ok) {
            if (data.image_base64) {
              imagePreview.src = data.image_base64;
            }
            showResult(data.result);
          } else {
            showResult(data.error || "An error occurred", true);
          }
        } catch (error) {
          console.error("Error:", error);
          showResult("Failed to connect to server.", true);
        } finally {
          // Restore button state
          analyzeBtn.disabled = false;
          analyzeBtnText.textContent = "Analyze Another Image";
          loadingIcon.classList.add("hidden");
        }
      }

      function showResult(message, isError = false) {
        resultContainer.classList.remove(
          "hidden",
          "border-red-500/50",
          "bg-red-500/10",
          "border-green-500/50",
          "bg-green-500/10",
          "border-rose-500/50",
          "bg-rose-500/10",
        );

        if (isError) {
          resultContainer.classList.add("border-red-500/50", "bg-red-500/10");
          resultText.className = "text-xl font-bold text-red-400";
        } else if (message.includes("Detected")) {
          resultContainer.classList.add("border-rose-500/50", "bg-rose-500/10"); // Reddish for Acne Selected
          resultText.className = "text-3xl font-bold text-rose-400";
        } else {
          resultContainer.classList.add(
            "border-green-500/50",
            "bg-green-500/10",
          ); // Greenish for Clear
          resultText.className = "text-3xl font-bold text-green-400";
        }

        resultText.textContent = message;

        // Animation pop
        resultContainer.classList.add("scale-105");
        setTimeout(() => resultContainer.classList.remove("scale-105"), 200);
      }
    </script>
  </body>
</html>
