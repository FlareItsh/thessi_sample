<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Acne Detector Pro — AI Skin Analysis</title>
		<meta name="description" content="Advanced AI-powered acne detection using face landmark analysis and multi-feature skin scanning." />
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							primary: "#4F46E5",
							secondary: "#10B981",
							dark: "#111827",
						},
						fontFamily: {
							sans: ["Inter", "sans-serif"],
						},
					},
				},
			};
		</script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				font-family: "Inter", sans-serif;
			}
			.glass-panel {
				background: rgba(255, 255, 255, 0.05);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.1);
			}
			.gradient-text {
				background-clip: text;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.zone-badge {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				padding: 4px 10px;
				border-radius: 9999px;
				font-size: 0.75rem;
				font-weight: 600;
				border: 1px solid rgba(255,255,255,0.1);
				background: rgba(255,255,255,0.05);
			}
			.zone-badge .dot {
				width: 6px; height: 6px;
				border-radius: 50%;
			}
			.severity-badge {
				display: inline-block;
				padding: 4px 14px;
				border-radius: 9999px;
				font-size: 0.8rem;
				font-weight: 700;
				letter-spacing: 0.05em;
				text-transform: uppercase;
			}
			@keyframes pulse-ring {
				0% { transform: scale(1); opacity: 0.6; }
				100% { transform: scale(1.4); opacity: 0; }
			}
			.face-status-dot {
				position: relative;
			}
			.face-status-dot::after {
				content: '';
				position: absolute;
				inset: -2px;
				border-radius: 50%;
				animation: pulse-ring 1.5s ease-out infinite;
			}
			.face-status-dot.detected::after {
				background: #10B981;
			}
			.annotated-preview {
				transition: opacity 0.3s ease;
			}
		</style>
	</head>
	<body
		class="bg-dark text-white min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary selection:text-white"
	>
		<div class="max-w-4xl w-full">
			<!-- Header -->
			<div class="text-center mb-10">
				<h1 class="text-5xl font-bold tracking-tight mb-4">
					<span
						class="bg-gradient-to-r from-primary to-purple-500 gradient-text"
						>Acne Detector</span
					>
					Pro
				</h1>
				<p class="text-gray-400 text-lg max-w-xl mx-auto">
					AI-powered skin analysis with face landmark detection &amp; multi-feature acne scanning
				</p>
			</div>

			<!-- Main Panel -->
			<div
				class="glass-panel rounded-2xl p-8 shadow-2xl transition-all duration-300 hover:shadow-primary/20"
			>
				<div class="grid md:grid-cols-2 gap-8 relative">
					<!-- Left Column: Input Options -->
					<div class="space-y-6 flex flex-col justify-center">
						<!-- File Upload -->
						<div>
							<label class="block text-sm font-medium text-gray-300 mb-2"
								>Upload Image</label
							>
							<div class="relative group">
								<input
									type="file"
									id="fileInput"
									accept="image/*"
									class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
									onchange="previewFile()"
								/>
								<div
									class="flex items-center justify-center w-full px-4 py-8 border-2 border-dashed border-gray-600 rounded-xl group-hover:border-primary transition-colors bg-gray-800/50"
								>
									<div class="text-center">
										<svg
											class="mx-auto h-12 w-12 text-gray-400 group-hover:text-primary transition-colors"
											fill="none"
											viewBox="0 0 24 24"
											stroke="currentColor"
										>
											<path
												stroke-linecap="round"
												stroke-linejoin="round"
												stroke-width="2"
												d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
											/>
										</svg>
										<p class="mt-2 text-sm text-gray-400">
											Click to browse or drag and drop
										</p>
									</div>
								</div>
							</div>
						</div>

						<div class="flex items-center justify-center space-x-4">
							<hr class="w-full border-gray-700" />
							<span
								class="text-xs text-gray-500 font-semibold uppercase tracking-wider"
								>or</span
							>
							<hr class="w-full border-gray-700" />
						</div>

						<!-- Camera Control -->
						<div>
							<label class="block text-sm font-medium text-gray-300 mb-2"
								>Use Camera</label
							>
							<button
								id="cameraBtn"
								onclick="toggleCamera()"
								class="w-full flex items-center justify-center px-4 py-3 border border-transparent text-sm font-medium rounded-xl text-white bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-dark focus:ring-gray-500 transition-colors"
							>
								<svg
									class="w-5 h-5 mr-2"
									fill="none"
									stroke="currentColor"
									viewBox="0 0 24 24"
									xmlns="http://www.w3.org/2000/svg"
								>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="2"
										d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
									></path>
									<path
										stroke-linecap="round"
										stroke-linejoin="round"
										stroke-width="2"
										d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
									></path>
								</svg>
								<span id="cameraBtnText">Open Camera</span>
							</button>

							<!-- Camera View (Hidden by default) -->
							<div
								id="cameraContainer"
								class="hidden mt-4 relative rounded-xl overflow-hidden bg-black aspect-video border border-gray-700"
							>
								<video
									id="video"
									class="w-full h-full object-cover"
									autoplay
									playsinline
								></video>
								<button
									onclick="captureImage()"
									class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-primary hover:bg-indigo-500 text-white rounded-full p-4 shadow-lg transition-transform active:scale-95 focus:outline-none"
								>
									<svg
										class="w-6 h-6"
										fill="none"
										stroke="currentColor"
										viewBox="0 0 24 24"
										xmlns="http://www.w3.org/2000/svg"
									>
										<path
											stroke-linecap="round"
											stroke-linejoin="round"
											stroke-width="2"
											d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
										></path>
										<path
											stroke-linecap="round"
											stroke-linejoin="round"
											stroke-width="2"
											d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
										></path>
									</svg>
								</button>
							</div>
						</div>

						<!-- Face Detection Status -->
						<div id="faceStatusBar" class="hidden glass-panel rounded-lg px-4 py-3 flex items-center space-x-3">
							<span id="faceStatusDot" class="face-status-dot w-3 h-3 rounded-full bg-gray-500 inline-block"></span>
							<span id="faceStatusText" class="text-sm text-gray-400">Waiting for analysis…</span>
						</div>
					</div>

					<!-- Right Column: Preview & Results -->
					<div class="flex flex-col h-full space-y-4">
						<div
							class="flex-grow glass-panel rounded-xl flex items-center justify-center p-2 relative min-h-[250px] overflow-hidden group"
						>
							<!-- Placeholder -->
							<div id="previewPlaceholder" class="text-center text-gray-500">
								<span class="block text-4xl mb-2">📷</span>
								<p class="text-sm">Image Preview</p>
							</div>

							<!-- Actual Image (original) -->
							<img
								id="imagePreview"
								class="hidden max-h-full max-w-full rounded-lg object-contain"
								alt="Preview"
							/>

							<!-- Annotated Image (from backend) -->
							<img
								id="annotatedPreview"
								class="hidden max-h-full max-w-full rounded-lg object-contain annotated-preview"
								alt="Annotated"
							/>

							<!-- Overlay Canvas (optional, for custom drawing) -->
							<canvas
								id="overlay"
								class="absolute inset-0 w-full h-full pointer-events-none"
							></canvas>
						</div>

						<!-- Annotated image toggle -->
						<div id="viewToggleContainer" class="hidden flex items-center justify-center space-x-3 text-sm">
							<button id="btnOriginal" onclick="showOriginalView()"
								class="px-3 py-1.5 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors font-medium">
								Original
							</button>
							<button id="btnAnnotated" onclick="showAnnotatedView()"
								class="px-3 py-1.5 rounded-lg bg-primary text-white hover:bg-indigo-500 transition-colors font-medium">
								AI Annotated
							</button>
						</div>

						<!-- Action Button -->
						<button
							id="analyzeBtn"
							onclick="analyzeImage()"
							disabled
							class="w-full relative overflow-hidden group py-3 px-6 rounded-xl font-bold text-lg text-white bg-gradient-to-r from-gray-700 to-gray-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg"
						>
							<span class="relative z-10 flex items-center justify-center">
								<svg
									id="loadingIcon"
									class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white"
									xmlns="http://www.w3.org/2000/svg"
									fill="none"
									viewBox="0 0 24 24"
								>
									<circle
										class="opacity-25"
										cx="12"
										cy="12"
										r="10"
										stroke="currentColor"
										stroke-width="4"
									></circle>
									<path
										class="opacity-75"
										fill="currentColor"
										d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
									></path>
								</svg>
								<span id="analyzeBtnText">Analyze Image</span>
							</span>
							<div
								class="absolute inset-0 h-full w-full bg-gradient-to-r from-primary to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300 hidden"
								id="analyzeBtnBgHover"
							></div>
						</button>

						<!-- Result Box -->
						<div
							id="resultContainer"
							class="hidden p-5 rounded-xl border transform transition-all duration-500 text-center space-y-3"
						>
							<p
								class="text-xs uppercase tracking-wider font-semibold text-gray-400 mb-1"
							>
								Analysis Result
							</p>
							<h3 id="resultTextDisplay" class="text-2xl font-bold"></h3>

							<!-- Severity badge -->
							<div id="severityContainer" class="hidden">
								<span id="severityBadge" class="severity-badge"></span>
							</div>

							<!-- Zone breakdown -->
							<div id="zoneBreakdown" class="hidden pt-3 border-t border-white/10">
								<p class="text-xs uppercase tracking-wider font-semibold text-gray-500 mb-2">Affected Zones</p>
								<div id="zoneChips" class="flex flex-wrap justify-center gap-2"></div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Footer -->
			<p class="text-center text-gray-500 text-sm mt-8">
				Powered by MediaPipe, OpenCV &amp; Advanced Image Processing. Built for academic thesis.
			</p>
		</div>

		<!-- Hidden canvas to grab video frames -->
		<canvas id="captureCanvas" class="hidden"></canvas>

		<script>
			// DOM Elements
			const fileInput = document.getElementById("fileInput");
			const imagePreview = document.getElementById("imagePreview");
			const annotatedPreview = document.getElementById("annotatedPreview");
			const previewPlaceholder = document.getElementById("previewPlaceholder");
			const analyzeBtn = document.getElementById("analyzeBtn");
			const analyzeBtnText = document.getElementById("analyzeBtnText");
			const analyzeBtnBgHover = document.getElementById("analyzeBtnBgHover");
			const resultContainer = document.getElementById("resultContainer");
			const resultTextDisplay = document.getElementById("resultTextDisplay");
			const loadingIcon = document.getElementById("loadingIcon");
			const faceStatusBar = document.getElementById("faceStatusBar");
			const faceStatusDot = document.getElementById("faceStatusDot");
			const faceStatusText = document.getElementById("faceStatusText");
			const viewToggleContainer = document.getElementById("viewToggleContainer");
			const severityContainer = document.getElementById("severityContainer");
			const severityBadge = document.getElementById("severityBadge");
			const zoneBreakdown = document.getElementById("zoneBreakdown");
			const zoneChips = document.getElementById("zoneChips");

			// Camera Elements
			const video = document.getElementById("video");
			const cameraContainer = document.getElementById("cameraContainer");
			const cameraBtnText = document.getElementById("cameraBtnText");
			const captureCanvas = document.getElementById("captureCanvas");

			let stream = null;
			let selectedFile = null;
			let base64Image = null;
			let lastSpots = [];
			let lastAnnotatedSrc = null;

			function enableAnalyzeBtn() {
				analyzeBtn.disabled = false;
				analyzeBtn.classList.remove("from-gray-700", "to-gray-600");
				analyzeBtn.classList.add("from-primary", "to-purple-600");
				analyzeBtnBgHover.classList.remove("hidden");
			}

			// --- File Upload Logic ---
			fileInput.addEventListener("change", previewFile);
			function previewFile() {
				const file = fileInput.files[0];
				if (file) {
					selectedFile = file;
					base64Image = null;
					const reader = new FileReader();
					reader.onload = function (e) {
						showPreview(e.target.result);
					};
					reader.readAsDataURL(file);
					if (stream) stopCamera();
				}
			}

			// --- Camera Logic ---
			async function toggleCamera() {
				if (stream) {
					stopCamera();
				} else {
					try {
						stream = await navigator.mediaDevices.getUserMedia({
							video: { facingMode: "user" },
							audio: false,
						});
						video.srcObject = stream;
						cameraContainer.classList.remove("hidden");
						cameraBtnText.textContent = "Close Camera";
					} catch (err) {
						console.error("Error accessing camera:", err);
						alert("Could not access camera. Please allow permissions or upload a file instead.");
					}
				}
			}

			function stopCamera() {
				if (stream) {
					stream.getTracks().forEach((track) => track.stop());
					stream = null;
					cameraContainer.classList.add("hidden");
					cameraBtnText.textContent = "Open Camera";
				}
			}

			function captureImage() {
				if (!stream) return;
				captureCanvas.width = video.videoWidth;
				captureCanvas.height = video.videoHeight;
				const ctx = captureCanvas.getContext("2d");
				ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
				const dataUrl = captureCanvas.toDataURL("image/jpeg", 0.9);
				base64Image = dataUrl;
				selectedFile = null;
				showPreview(dataUrl);
				stopCamera();
			}

			// --- View toggle ---
			function showOriginalView() {
				imagePreview.classList.remove("hidden");
				annotatedPreview.classList.add("hidden");
				document.getElementById("btnOriginal").classList.add("bg-primary", "text-white");
				document.getElementById("btnOriginal").classList.remove("bg-gray-700", "text-gray-300");
				document.getElementById("btnAnnotated").classList.remove("bg-primary", "text-white");
				document.getElementById("btnAnnotated").classList.add("bg-gray-700", "text-gray-300");
			}

			function showAnnotatedView() {
				if (lastAnnotatedSrc) {
					annotatedPreview.classList.remove("hidden");
					imagePreview.classList.add("hidden");
					document.getElementById("btnAnnotated").classList.add("bg-primary", "text-white");
					document.getElementById("btnAnnotated").classList.remove("bg-gray-700", "text-gray-300");
					document.getElementById("btnOriginal").classList.remove("bg-primary", "text-white");
					document.getElementById("btnOriginal").classList.add("bg-gray-700", "text-gray-300");
				}
			}

			// --- Common Preview ---
			function showPreview(src) {
				lastSpots = [];
				lastAnnotatedSrc = null;
				imagePreview.src = src;
				imagePreview.classList.remove("hidden");
				annotatedPreview.classList.add("hidden");
				previewPlaceholder.classList.add("hidden");
				resultContainer.classList.add("hidden");
				faceStatusBar.classList.add("hidden");
				viewToggleContainer.classList.add("hidden");
				enableAnalyzeBtn();
			}

			// --- Face status update ---
			function updateFaceStatus(detected, zoneInfo) {
				faceStatusBar.classList.remove("hidden", "flex");
				faceStatusBar.classList.add(detected ? "flex" : "hidden");
				if (detected) {
					const visibleZones = (zoneInfo && zoneInfo.visible_zones) ? zoneInfo.visible_zones : [];
					const zoneNames = visibleZones.map(z => ZONE_LABELS[z] || z).join(", ");
					faceStatusDot.className = "face-status-dot detected w-3 h-3 rounded-full bg-green-400 inline-block";
					faceStatusText.textContent = visibleZones.length > 0
						? `Scanning: ${zoneNames}`
						: "Face detected — scanning skin zones";
					faceStatusText.className = "text-sm text-green-400";
				} else {
					faceStatusDot.className = "face-status-dot w-3 h-3 rounded-full bg-red-400 inline-block";
					faceStatusText.textContent = "No face found — please provide a clear face photo";
					faceStatusText.className = "text-sm text-red-400";
				}
			}

			// --- Zone colours (BGR to RGB mappings from backend) ---
			const ZONE_COLORS = {
				forehead: "#FF82B4",
				left_cheek: "#FFB432",
				right_cheek: "#FF5032",
				nose: "#32B4FF",
				chin: "#82DC32",
				other: "#969696",
				cropped_skin: "#FF1493",
			};

			const ZONE_LABELS = {
				forehead: "Forehead",
				left_cheek: "Left Cheek",
				right_cheek: "Right Cheek",
				nose: "Nose",
				chin: "Chin",
				other: "Other",
				cropped_skin: "Cropped Skin",
			};

			// --- API Submission ---
			async function analyzeImage() {
				if (!selectedFile && !base64Image) return;

				analyzeBtn.disabled = true;
				analyzeBtnText.textContent = "Analyzing…";
				loadingIcon.classList.remove("hidden");
				resultContainer.classList.add("hidden");
				faceStatusBar.classList.add("hidden");
				viewToggleContainer.classList.add("hidden");

				try {
					let formData = new FormData();
					if (selectedFile) formData.append("file", selectedFile);
					else if (base64Image) formData.append("image_base64", base64Image);

					const response = await fetch("/predict", {
						method: "POST",
						body: formData,
					});
					const data = await response.json();

					if (response.ok) {
						lastSpots = data.spots || [];
						updateFaceStatus(data.face_detected, data.zone_info);

						if (data.annotated_image) {
							lastAnnotatedSrc = data.annotated_image;
							annotatedPreview.src = data.annotated_image;
							viewToggleContainer.classList.remove("hidden");
							viewToggleContainer.classList.add("flex");
							showAnnotatedView();
						}

						showResult(data.result, false, data.zone_info);
					} else {
						showResult(data.error || "An error occurred", true);
					}
				} catch (error) {
					console.error("Error:", error);
					showResult("Failed to connect to server.", true);
				} finally {
					analyzeBtn.disabled = false;
					analyzeBtnText.textContent = "Analyze Another Image";
					loadingIcon.classList.add("hidden");
				}
			}

			function showResult(message, isError = false, zoneInfo = null) {
				resultContainer.classList.remove(
					"hidden",
					"border-red-500/50", "bg-red-500/10",
					"border-green-500/50", "bg-green-500/10",
					"border-rose-500/50", "bg-rose-500/10",
					"border-yellow-500/50", "bg-yellow-500/10",
					"border-orange-500/50", "bg-orange-500/10",
				);
				severityContainer.classList.add("hidden");
				zoneBreakdown.classList.add("hidden");

				if (isError) {
					resultContainer.classList.add("border-red-500/50", "bg-red-500/10");
					resultTextDisplay.className = "text-xl font-bold text-red-400";
				} else if (message.includes("Detected")) {
					resultContainer.classList.add("border-rose-500/50", "bg-rose-500/10");
					resultTextDisplay.className = "text-2xl font-bold text-rose-400";
				} else if (message.includes("No Face") || !zoneInfo?.total_spots) {
					resultContainer.classList.add("border-green-500/50", "bg-green-500/10");
					resultTextDisplay.className = "text-2xl font-bold text-green-400";
				} else {
					resultContainer.classList.add("border-green-500/50", "bg-green-500/10");
					resultTextDisplay.className = "text-2xl font-bold text-green-400";
				}
				resultTextDisplay.textContent = message;

				if (zoneInfo) {
					if (zoneInfo.total_spots > 0) {
						const sev = zoneInfo.severity;
						severityContainer.classList.remove("hidden");
						severityBadge.textContent = sev;
						severityBadge.className = "severity-badge";
						if (sev === "Mild") {
							severityBadge.classList.add("bg-yellow-500/20", "text-yellow-400", "border", "border-yellow-500/30");
						} else if (sev === "Moderate") {
							severityBadge.classList.add("bg-orange-500/20", "text-orange-400", "border", "border-orange-500/30");
						} else if (sev === "Severe") {
							severityBadge.classList.add("bg-red-500/20", "text-red-400", "border", "border-red-500/30");
						}

						const activeZones = zoneInfo.active_zones || {};
						if (Object.keys(activeZones).length > 0) {
							zoneBreakdown.classList.remove("hidden");
							zoneBreakdown.querySelector("p").textContent = "Affected Zones";
							zoneChips.innerHTML = "";
							for (const [zone, count] of Object.entries(activeZones)) {
								const chip = document.createElement("span");
								chip.className = "zone-badge";
								const color = ZONE_COLORS[zone] || "#6B7280";
								const label = ZONE_LABELS[zone] || zone;
								chip.innerHTML = `<span class="dot" style="background:${color}"></span> ${label}: ${count}`;
								zoneChips.appendChild(chip);
							}
						}
					} else if (zoneInfo.visible_zones && zoneInfo.visible_zones.length > 0) {
						zoneBreakdown.classList.remove("hidden");
						zoneBreakdown.querySelector("p").textContent = "Zones Scanned (Clear)";
						zoneChips.innerHTML = "";
						for (const zone of zoneInfo.visible_zones) {
							const chip = document.createElement("span");
							chip.className = "zone-badge";
							const color = ZONE_COLORS[zone] || "#6B7280";
							const label = ZONE_LABELS[zone] || zone;
							chip.innerHTML = `<span class="dot" style="background:${color}"></span> ${label} ✓`;
							zoneChips.appendChild(chip);
						}
					}
				}

				resultContainer.classList.add("scale-105");
				setTimeout(() => resultContainer.classList.remove("scale-105"), 200);
			}
		</script>
	</body>
</html>
